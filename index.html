<title>痛扁小老頭</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
[hidden]{display:none!important}
/* 版面：整個畫面就是公園（canvas），上面浮著分數、搖桿和撞擊鈕 */
:root{
  --grass:#86bd4f;
  --ink:#3b2716;
  --hero:#f3b62c;
  --hero-deep:#d38b12;
  --paper:#fff8e6;
  --pow:#e2412f;
  --font-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--grass);color:var(--ink);
  font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  display:flex;gap:10px;align-items:center;pointer-events:none}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 12px 7px;
  box-shadow:0 4px 0 var(--ink);display:flex;align-items:baseline;gap:6px;line-height:1}
.chip b{font-family:var(--font-display);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums;color:var(--pow)}
.chip span{font-size:13px;font-weight:700}
.chip.best b{font-size:18px;color:var(--ink)}

#bump{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:var(--hero);
  box-shadow:0 6px 0 var(--ink);font-family:var(--font-display);font-weight:900;font-size:26px;color:var(--ink);
  touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#bump:active,#bump.on{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);background:var(--hero-deep)}
#bump:focus-visible{outline:3px solid #fff;outline-offset:3px}
#bump small{display:block;font-size:11px;font-weight:700;margin-top:-2px}

.stick{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
#stickBase{width:124px;height:124px;background:rgba(255,248,230,.28);border:3px solid rgba(59,39,22,.55)}
#stickKnob{width:58px;height:58px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
#stickHint{position:fixed;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));
  font-size:13px;font-weight:700;background:rgba(255,248,230,.85);border:2px solid var(--ink);border-radius:10px;padding:6px 10px;pointer-events:none}

#start{position:fixed;inset:0;display:grid;place-items:center;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:rgba(59,39,22,.45);overflow:auto}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);
  max-width:380px;width:100%;padding:22px 22px 24px;display:grid;gap:14px;justify-items:center;text-align:center}
.card img{height:150px;width:auto;animation:wobble 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
h1{margin:0;font-family:var(--font-display);font-weight:900;font-size:44px;line-height:1.05;letter-spacing:2px;
  color:var(--hero);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);
  transform:rotate(-3deg);text-wrap:balance}
.lede{margin:0;font-size:15px;line-height:1.6;font-weight:500;max-width:30ch}
.keys{display:grid;gap:8px;width:100%;font-size:14px;font-weight:700}
.keys div{display:flex;justify-content:space-between;gap:10px;border-top:2px dashed rgba(59,39,22,.3);padding-top:8px}
kbd{font-family:var(--font-body);background:#fff;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;padding:1px 6px;font-size:12px}
#go{font-family:var(--font-display);font-weight:900;font-size:22px;background:var(--pow);color:#fff;border:4px solid var(--ink);
  border-radius:16px;padding:10px 36px;box-shadow:0 6px 0 var(--ink);cursor:pointer;letter-spacing:2px}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#go:focus-visible{outline:3px solid var(--hero);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card img{animation:none}}
</style>

<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="chip"><b id="score">0</b><span>個被扁</span></div>
  <div class="chip best"><span>最高</span><b id="best">0</b></div>
</div>

<div id="stickBase" class="stick" hidden></div>
<div id="stickKnob" class="stick" hidden></div>
<div id="stickHint" hidden>左半邊按住拖曳＝走路</div>
<button id="bump" type="button" hidden>撞！<small>肚子攻擊</small></button>

<div id="start">
  <div class="card">
    <img id="startImg" alt="主角">
    <h1>痛扁小老頭</h1>
    <p class="lede">公園裡的小老頭整天碎碎念。走過去，用你的大肚子把他們撞飛！</p>
    <div class="keys" id="keysPC">
      <div><span>走路</span><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span></div>
      <div><span>肚子撞</span><span><kbd>空白鍵</kbd> 或 <kbd>J</kbd></span></div>
    </div>
    <div class="keys" id="keysTouch" hidden>
      <div><span>走路</span><span>左半邊手指按住拖曳</span></div>
      <div><span>肚子撞</span><span>按右下「撞！」或點右半邊</span></div>
    </div>
    <button id="go" type="button">開始玩</button>
  </div>
</div>

      o.x += o.vx * dt; o.y += o.vy * dt; o.z += o.vz * dt; o.vz -= 1900 * dt; o.spin += o.spinV * dt;
      collide(o);
      if (o.z <= 0 && o.vz < 0) {
        o.z = 0; sfx.land(); puff(o.x, o.y, 1.3);
        if (o.bounces < 1) { o.bounces++; o.vz = -o.vz * .38; o.vx *= .5; o.vy *= .5; }
        else { o.state = 'down'; o.t = 1.9; o.vx = o.vy = 0; o.spin = 0; o.bouncy = false; }
      }
      return;
    case 'down':
      o.t -= dt;
      if (o.t <= 0) { o.state = 'flee'; o.t = 2.6; say(o, ['你給我記住！', '我要跟里長講！', '哼！不跟你計較']); }
      break;
  }
  if (o.say === null && o.sayCd <= 0 && (o.state === 'chase' || (o.state === 'idle' && dh < 220))) { say(o, NAG); o.sayCd = rand(3, 6); }
  o.sayCd -= dt;
  o.x += o.vx * dt; o.y += o.vy * dt;
  if (Math.abs(o.vx) > 5) o.face = o.vx > 0 ? 1 : -1;
  o.walkT += speed * dt * 0.12;
  collide(o);
  // 不要跟主角重疊
  if (o.state !== 'down') { const dx = o.x - hero.x, dy = o.y - hero.y, d = Math.hypot(dx, dy), m = o.r + hero.r; if (d < m && d > .01) { o.x = hero.x + dx / d * m; o.y = hero.y + dy / d * m; } }
}

// ---------- 特效 ----------
const fx = [];
function puff(x, y, s) { for (let i = 0; i < 3; i++) fx.push({ k: 'puff', x: x + rand(-6, 6), y: y + rand(-3, 3), vx: rand(-30, 30), vy: rand(-25, -5), r: rand(5, 9) * s, t: 0, life: rand(.35, .55) }); }
function burst(x, y) { for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28 + rand(-.2, .2), v = rand(220, 380); fx.push({ k: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .8, r: rand(6, 10), t: 0, life: .5, rot: rand(0, 6) }); } }
function pop(text, x, y, s) { fx.push({ k: 'text', text, x, y, vy: -90, t: 0, life: .9, s }); }
function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt; if (f.t >= f.life) { fx.splice(i, 1); continue; }
    if (f.k === 'text') { f.y += f.vy * dt; f.vy *= Math.exp(-3 * dt); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= Math.exp(-5 * dt); f.vy *= Math.exp(-5 * dt); if (f.rot !== undefined) f.rot += dt * 8;
  }
}

// ---------- 繪圖 ----------
const INK = '#3b2716';
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, 7); }
function starPath(x, y, r, rot) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); }

function drawShadow(x, y, rx, ry, a = .22) { ctx.fillStyle = `rgba(40,60,20,${a})`; ell(x, y, rx, ry); ctx.fill(); }

const easeOut = t => 1 - (1 - t) * (1 - t);
function attackPose() {
  const a = hero.atk; let wind = 0, thrust = 0;
  if (a < 0) return { wind, thrust };
  if (a < ATK_WIND) wind = easeOut(a / ATK_WIND);
  else {
    const b = a - ATK_WIND;
    wind = Math.max(0, 1 - b / 0.05);
    thrust = b < 0.05 ? easeOut(b / 0.05) : b < ATK_HOLD ? 1 : Math.max(0, 1 - (b - ATK_HOLD) / ATK_BACK);
  }

}
function drawLeg(img, hip, ang, lift) {
  ctx.save(); ctx.translate(hip[0], hip[1] - lift); ctx.rotate(ang); ctx.translate(-hip[0], -hip[1]);
  ctx.drawImage(img, 0, 0); ctx.restore();
}
function drawHero(time) {
  const sp = clamp(Math.hypot(hero.vx, hero.vy) / MAXSPD, 0, 1);
  const { wind, thrust } = attackPose();
  const walk = sp * (1 - thrust) * (1 - wind);
  const sn = Math.sin(hero.walkT * Math.PI);
  const breathe = Math.sin(time * 2.6) * 0.02 * (1 - sp);
  // 以下數值都是「原圖像素」，原圖面向左，所以往前 = x 變小
  const legF = sn * 0.45 * walk + thrust * 0.55 - wind * 0.2;
  const legB = -sn * 0.45 * walk - thrust * 0.5 + wind * 0.2;
  const liftF = Math.max(0, sn) * 8 * walk, liftB = Math.max(0, -sn) * 8 * walk;
  const bob = (1 - Math.abs(sn)) * 6 * walk - wind * 9 - thrust * 3;
  const rot = sn * 0.06 * walk - sp * 0.06 * (1 - thrust) - wind * 0.16 + thrust * 0.26;
  const bsx = 1 + thrust * 0.14 + wind * 0.07, bsy = 1 + breathe - wind * 0.1 + thrust * 0.02;
  const shift = -thrust * 10 + wind * 4;

  drawShadow(hero.x, hero.y + 2, 30 * (1 + thrust * .25), 9);
  if (!parts.ready) return;
  const k = HERO_H / heroImg.height, iw = heroImg.width, ih = heroImg.height;
  ctx.save();
  ctx.translate(hero.x, hero.y); ctx.scale(k * (hero.face > 0 ? -1 : 1), k); ctx.translate(-iw / 2, -ih + 4 / k);
  drawLeg(parts.legB, HIP_B, legB, liftB);
  drawLeg(parts.legF, HIP_F, legF, liftF);
  ctx.save();
  ctx.translate(BODY_PIVOT[0] + shift, BODY_PIVOT[1] - bob); ctx.rotate(rot); ctx.scale(bsx, bsy); ctx.translate(-BODY_PIVOT[0], -BODY_PIVOT[1]);
  ctx.drawImage(parts.body, 0, 0);
  ctx.restore();
  // 衝撞時：身後的速度線、肚子前的衝擊波
  if (thrust > 0.05) {
    ctx.globalAlpha = thrust * 0.9; ctx.strokeStyle = '#fff8e6'; ctx.lineCap = 'round'; ctx.lineWidth = 5;
    for (const [y, len] of [[70, 34], [110, 46], [150, 30]]) { ctx.beginPath(); ctx.moveTo(iw + 4, y); ctx.lineTo(iw + 4 + len * thrust, y); ctx.stroke(); }
    ctx.strokeStyle = '#3b2716'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(14, 120, 30 + thrust * 14, Math.PI * 0.72, Math.PI * 1.28); ctx.stroke();
    ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(14, 120, 30 + thrust * 14, Math.PI * 0.72, Math.PI * 1.28); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawOld(o, time) {
  ctx.save(); ctx.globalAlpha = Math.max(0, o.alpha);
  const z = o.z;
  drawShadow(o.x, o.y + 1, 17 * (1 - Math.min(z / 400, .5)), 5.5);
  ctx.translate(o.x, o.y - z);
  if (o.state === 'fly') { ctx.translate(0, -34); ctx.rotate(o.spin); ctx.translate(0, 34); }
  if (o.state === 'down') { ctx.translate(0, -6); ctx.rotate(-o.lie * Math.PI / 2 * .92); }
  ctx.scale(o.face, 1);
  const moving = o.state === 'walk' || o.state === 'chase' || o.state === 'flee';
  const w = moving ? Math.sin(o.walkT) : 0, bob = moving ? Math.abs(Math.cos(o.walkT)) * 2 : 0;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
  const SKIN = '#f0c39b';
  // 腿 + 藍白拖
  for (const [hx, sw] of [[-5, w], [5, -w]]) {
    const fx_ = hx + sw * 8, fy = -Math.max(0, sw) * 3;
    ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.beginPath(); ctx.moveTo(hx, -26); ctx.lineTo(fx_, fy - 3); ctx.stroke();
    ctx.lineWidth = 6; ctx.strokeStyle = SKIN; ctx.beginPath(); ctx.moveTo(hx, -26); ctx.lineTo(fx_, fy - 3); ctx.stroke();
    ctx.fillStyle = '#3f7fd0'; ctx.strokeStyle = INK; ctx.lineWidth = 2; ell(fx_ + 3, fy, 8, 3.5); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(fx_, fy - 2); ctx.lineTo(fx_ + 5, fy - 2); ctx.stroke();
  }
  ctx.translate(0, -bob);
  // 短褲
  ctx.fillStyle = o.pants; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-12, -38, 24, 14, 4); ctx.fill(); ctx.stroke();
  // 後手
  ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.beginPath(); ctx.moveTo(-6, -52); ctx.lineTo(-11 - w * 3, -36); ctx.stroke();
  ctx.lineWidth = 5; ctx.strokeStyle = SKIN; ctx.beginPath(); ctx.moveTo(-6, -52); ctx.lineTo(-11 - w * 3, -36); ctx.stroke();
  // 白汗衫肚子
  ctx.fillStyle = '#fbfaf3'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ell(1, -46, 14, 15); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.06)'; ell(-3, -41, 8, 8); ctx.fill();
  // 拐杖 + 前手
  const cx_ = 17 + w * 2;
  ctx.strokeStyle = '#7a4b22'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(cx_, -1); ctx.lineTo(15, -38); ctx.arc(19, -38, 4, Math.PI, 0); ctx.stroke();
  ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.beginPath(); ctx.moveTo(6, -53); ctx.lineTo(15, -37); ctx.stroke();
  ctx.lineWidth = 5; ctx.strokeStyle = SKIN; ctx.beginPath(); ctx.moveTo(6, -53); ctx.lineTo(15, -37); ctx.stroke();
  // 頭
  ctx.fillStyle = SKIN; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ell(3, -68, 12.5, 12); ctx.fill(); ctx.stroke();
  ell(-6, -67, 3, 4); ctx.fill(); ctx.stroke(); // 耳朵
  ctx.fillStyle = '#ffffff';
  if (o.bald) { ctx.globalAlpha *= .65; ell(0, -76, 4, 2); ctx.fill(); ctx.globalAlpha = Math.max(0, o.alpha); ell(-7, -72, 4.5, 3.5); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(3, -70, 12.5, Math.PI * 1.02, Math.PI * 1.95); ctx.lineTo(13, -74); ctx.quadraticCurveTo(3, -77, -9, -66); ctx.fill(); }
  // 臉
  const knocked = o.state === 'fly' || o.state === 'down';
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  if (knocked) { ctx.beginPath(); ctx.moveTo(6, -71); ctx.lineTo(11, -66); ctx.moveTo(11, -71); ctx.lineTo(6, -66); ctx.stroke(); }
  else { ctx.fillStyle = INK; ell(9, -69, 1.8, 2); ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(5, -74); ctx.lineTo(12, o.state === 'chase' ? -72 : -75); ctx.stroke(); }
  ctx.fillStyle = '#e3a47c'; ell(14.5, -65, 3.2, 3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ell(11, -60, 6.5, 3); ctx.fill(); ctx.stroke();
  ctx.restore();
  if (o.state === 'down') { // 頭上轉圈圈的星星
    const hx = o.x + o.lie * 62, hy = o.y - 14;
    for (let i = 0; i < 3; i++) { const a = time * 5 + i * 2.09; ctx.fillStyle = '#ffd54a'; ctx.strokeStyle = INK; ctx.lineWidth = 1.5; starPath(hx + Math.cos(a) * 16, hy - 12 + Math.sin(a) * 5, 6, a); ctx.fill(); ctx.stroke(); }
  }
}

function drawTree(p, fade) {
  const s = p.s; ctx.save(); ctx.translate(p.x, p.y);
  if (p.type === 'bush') {
    drawShadow(0, 2, 34 * s, 10 * s);
    ctx.globalAlpha = fade; const base = p.hue < .5 ? ['#3f7d2e', '#58a03c', '#7cc155'] : ['#3a7436', '#4f9746', '#72b964'];
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    for (const [x, y, r] of [[-16, -14, 18], [16, -14, 18], [0, -24, 22]]) { ctx.fillStyle = base[1]; ctx.beginPath(); ctx.arc(x * s, y * s, r * s, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = base[2]; ctx.beginPath(); ctx.arc(-4 * s, -32 * s, 8 * s, 0, 7); ctx.fill();
    if (p.hue > .7) { ctx.fillStyle = '#ff6f91'; for (const [x, y] of [[-14, -20], [8, -30], [18, -12], [-2, -14]]) { ctx.beginPath(); ctx.arc(x * s, y * s, 3, 0, 7); ctx.fill(); } }
    ctx.restore(); return;
  }
  drawShadow(4, 2, 46 * s, 14 * s);
  ctx.fillStyle = '#8a5a2e'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-8 * s, 0); ctx.lineTo(-6 * s, -48 * s); ctx.lineTo(6 * s, -48 * s); ctx.lineTo(9 * s, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.globalAlpha = fade;
  const pal = p.hue < .33 ? ['#2f6b2a', '#3f8a33', '#66b04a'] : p.hue < .66 ? ['#32702f', '#4a9a3a', '#7cc456'] : ['#2c6538', '#3e8749', '#68b06a'];
  const blobs = [[-26, -62, 30], [26, -60, 30], [0, -92, 36], [-14, -80, 28], [16, -84, 28]];
  ctx.fillStyle = INK; for (const [x, y, r] of blobs) { ctx.beginPath(); ctx.arc(x * s, (y + 3) * s, r * s + 2.5, 0, 7); ctx.fill(); }
  ctx.fillStyle = pal[0]; for (const [x, y, r] of blobs) { ctx.beginPath(); ctx.arc(x * s, (y + 3) * s, r * s, 0, 7); ctx.fill(); }
  ctx.fillStyle = pal[1]; for (const [x, y, r] of blobs) { ctx.beginPath(); ctx.arc(x * s, (y - 3) * s, r * s - 3, 0, 7); ctx.fill(); }
  ctx.fillStyle = pal[2]; for (const [x, y, r] of [[-12, -104, 14], [-30, -72, 11], [20, -96, 10]]) { ctx.beginPath(); ctx.arc(x * s, y * s, r * s, 0, 7); ctx.fill(); }
  ctx.restore();
}
function drawBench(p) {
  ctx.save(); ctx.translate(p.x, p.y); drawShadow(0, 2, 40, 8);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.fillStyle = '#5a4030';
  ctx.fillRect(-30, -12, 4, 12); ctx.fillRect(26, -12, 4, 12);
  ctx.fillStyle = '#c27a3e'; ctx.beginPath(); ctx.roundRect(-36, -18, 72, 8, 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(-36, -36, 72, 8, 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a4030'; ctx.fillRect(-30, -30, 3, 12); ctx.fillRect(27, -30, 3, 12);
  ctx.restore();
}
function drawLamp(p, time) {
  ctx.save(); ctx.translate(p.x, p.y); drawShadow(0, 1, 10, 4);
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -70); ctx.stroke();
  ctx.strokeStyle = '#4b5a4f'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -70); ctx.stroke();
  ctx.fillStyle = '#fff3c2'; ctx.strokeStyle = INK; ctx.lineWidth = 2; ell(0, -76, 8, 9); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4b5a4f'; ctx.beginPath(); ctx.moveTo(-10, -84); ctx.lineTo(10, -84); ctx.lineTo(0, -92); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawBubble(o) {
  if (!o.say || o.alpha < .5) return;
  const t = o.say.text, a = clamp(o.say.t * 4, 0, 1);
  ctx.save(); ctx.globalAlpha = a; ctx.font = '700 14px ' + FONT;
  const w = ctx.measureText(t).width + 18, h = 26, x = o.x - w / 2, y = o.y - o.z - (o.state === 'down' ? 70 : 112);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(o.x - 6, y + h - 1); ctx.lineTo(o.x, y + h + 8); ctx.lineTo(o.x + 5, y + h - 1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(o.x - 6, y + h); ctx.lineTo(o.x, y + h + 8); ctx.lineTo(o.x + 5, y + h); ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, o.x, y + h / 2 + 1);
  ctx.restore();
}
function drawFx() {
  for (const f of fx) {
    const k = f.t / f.life;
    if (f.k === 'puff') { ctx.fillStyle = `rgba(245,235,205,${.75 * (1 - k)})`; ell(f.x, f.y - 4, f.r * (1 + k), f.r * (1 + k) * .8); ctx.fill(); }
    else if (f.k === 'star') { ctx.globalAlpha = 1 - k; ctx.fillStyle = '#ffd54a'; ctx.strokeStyle = INK; ctx.lineWidth = 1.5; starPath(f.x, f.y, f.r * (1 - k * .4), f.rot); ctx.fill(); ctx.stroke(); ctx.globalAlpha = 1; }
    else if (f.k === 'text') {
      const sc = f.s * (k < .15 ? .6 + k / .15 * .6 : 1.2 - (k - .15) * .25);
      ctx.save(); ctx.translate(f.x, f.y); ctx.scale(sc, sc); ctx.rotate(-.08); ctx.globalAlpha = k > .7 ? (1 - k) / .3 : 1;
      ctx.font = '900 34px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.strokeText(f.text, 0, 0);
      ctx.fillStyle = '#e2412f'; ctx.fillText(f.text, 0, 0); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillText(f.text, 0, -2);
      ctx.restore();
    }
  }
}

// ---------- 主迴圈 ----------
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const cam = { x: hero.x, y: hero.y };
let running = false, score = 0, best = 0, combo = 0, lastHit = -9, shake = 0, hitStop = 0, last = performance.now(), time = 0;
try { best = +localStorage.getItem('tbxlt-best') || 0; } catch (_) {}
$('best').textContent = best;

function frame(now) {
  let dt = Math.min(.033, (now - last) / 1000); last = now; time += dt;
  if (running) {
    if (hitStop > 0) { hitStop -= dt; }
    else { updateHero(dt); for (const o of olds) updateOld(o, dt); }
    updateFx(dt);
  }
  // 鏡頭：跟著主角、稍微看向前方
  const vw = W / ZOOM, vh = H / ZOOM;
  const tx = clamp(hero.x + hero.vx * .22, vw / 2, WORLD.w - vw / 2), ty = clamp(hero.y - 40 + hero.vy * .18, vh / 2, WORLD.h - vh / 2);
  const ck = 1 - Math.exp(-6 * dt); cam.x = lerp(cam.x, vw > WORLD.w ? WORLD.w / 2 : tx, ck); cam.y = lerp(cam.y, vh > WORLD.h ? WORLD.h / 2 : ty, ck);
  shake *= Math.exp(-12 * dt);
  const shx = (Math.random() - .5) * shake, shy = (Math.random() - .5) * shake;

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#4f8a33'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  const S = DPR * ZOOM;
  ctx.setTransform(S, 0, 0, S, (W / 2 - (cam.x + shx) * ZOOM) * DPR, (H / 2 - (cam.y + shy) * ZOOM) * DPR);
  ctx.drawImage(ground, 0, 0);

  const x0 = cam.x - vw / 2 - 150, x1 = cam.x + vw / 2 + 150, y0 = cam.y - vh / 2 - 50, y1 = cam.y + vh / 2 + 200;
  const list = [];
  for (const p of props) if (p.x > x0 && p.x < x1 && p.y > y0 && p.y < y1) list.push(p);
  for (const o of olds) list.push(o);
  list.push(hero);
  list.sort((a, b) => a.y - b.y);
  for (const e of list) {
    if (e === hero) drawHero(time);
    else if (e.state) drawOld(e, time);
    else if (e.type === 'tree' || e.type === 'bush') {
      // 主角走到樹後面時，樹變半透明
      const behind = hero.y < e.y && hero.y > e.y - 150 * e.s && Math.abs(hero.x - e.x) < 80 * e.s;
      e.fade = lerp(e.fade ?? 1, behind ? .3 : 1, .2); drawTree(e, e.fade);
    }
    else if (e.type === 'bench') drawBench(e);
    else if (e.type === 'lamp') drawLamp(e, time);
  }
  drawFx();
  for (const o of olds) drawBubble(o);
  requestAnimationFrame(frame);
}

function start(data) {
  if (data && data.score) { score = data.score; $('score').textContent = score; }
  for (let i = 0; i < 7; i++) olds.push(spawnOld(i < 3));
  for (const o of olds) o.alpha = 1;
  requestAnimationFrame(t => { last = t; frame(t); });
}
$('go').addEventListener('click', () => {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume && AC.resume(); } catch (_) {}
  $('start').hidden = true; $('hud').hidden = false;
  if (isTouch) { bumpBtn.hidden = false; $('stickHint').hidden = false; }
  running = true; cvs.focus && cvs.focus();
});
window.claude?.hot?.snapshot?.(() => ({ score }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
